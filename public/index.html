<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Card Deal Sniper</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--line:#2a2f3a;--text:#e8eaee;--mute:#9aa1ad;--acc:#ffcb05;--good:#3ecf8e;--bad:#ff5d5d;--warn:#ffb020;--blue:#5aa9ff;--r:14px}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px calc(10px) ;display:flex;align-items:center;gap:10px}
  header h1{font-size:17px;margin:0;letter-spacing:.3px;flex:1}
  header h1 span{color:var(--acc)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--mute);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
  .dot.ok{background:var(--good)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
  main{max-width:820px;margin:0 auto;padding:14px 14px 96px}
  nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--mute);padding:10px 0 9px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  nav button b{font-size:18px;font-weight:400}
  nav button.on{color:var(--acc)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin:0 0 10px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{background:var(--panel2);border-radius:10px;padding:10px 12px}
  .stat .k{font-size:12px;color:var(--mute)} .stat .v{font-size:20px;font-weight:650;margin-top:2px}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}
  button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer;font-weight:550}
  button.btn:active{transform:scale(.98)}
  button.pri{background:var(--acc);color:#111;border-color:var(--acc)}
  button.danger{color:var(--bad)}
  button.sm{padding:6px 10px;font-size:13px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row>*{flex:0 0 auto}
  label{display:block;font-size:12px;color:var(--mute);margin:8px 0 4px}
  input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 10px;font:inherit}
  textarea{min-height:80px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
  input[type=checkbox]{width:auto;transform:scale(1.25);margin-right:8px}
  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}.two>*{min-width:0}
  .item>b{display:block;color:var(--text);margin-top:4px}
  .item .top .row{flex-wrap:nowrap}
  .item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .item .top b{font-size:14px;color:var(--text)}
  pre{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#d6dae2}
  .mute{color:var(--mute);font-size:12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:650;background:var(--line)}
  .pill.buy{background:rgba(62,207,142,.18);color:var(--good)} .pill.wait{background:rgba(255,176,32,.15);color:var(--warn)}
  .pill.restock{background:rgba(255,93,93,.18);color:var(--bad)} .pill.drop{background:rgba(90,169,255,.18);color:var(--blue)}
  .err{background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.4);color:#ffb3b3;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
  .okmsg{background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.4);color:#a8f0cf;border-radius:10px;padding:10px;font-size:13px;margin-bottom:10px}
  .log{max-height:320px;overflow:auto;background:#0a0c10;border-radius:10px;padding:8px}
  .seg{display:flex;background:var(--panel2);border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:0;color:var(--mute);padding:8px;border-radius:8px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--line);color:var(--text)}
  a{color:var(--blue)}
  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222833;border:1px solid var(--line);padding:10px 14px;border-radius:10px;z-index:9;max-width:92%;font-size:14px;display:none}
  .savebar{position:sticky;bottom:72px;z-index:4;display:none;margin-top:6px}
  .savebar.show{display:block}
  .savebar button{width:100%;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .spark{font-family:ui-monospace,monospace;letter-spacing:1px;color:var(--acc)}
  ol.check{padding-left:20px;margin:6px 0} ol.check li{margin:4px 0}
  .combo{position:relative}
  .combo input{padding-right:38px}
  .combo .cbtn{position:absolute;right:4px;top:4px;bottom:4px;width:32px;border:0;border-radius:7px;background:var(--panel2);color:var(--mute);font-size:14px;cursor:pointer}
  .cpanel{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:20;background:#12151b;border:1px solid var(--line);border-radius:10px;max-height:300px;overflow:auto;box-shadow:0 12px 32px rgba(0,0,0,.6)}
  .cpanel.open{display:block}
  .cpanel .grp{position:sticky;top:0;background:#1a1e26;color:var(--acc);font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:6px 10px}
  .cpanel .opt{padding:10px 12px;border-bottom:1px solid #1c2029;cursor:pointer;font-size:14px}
  .cpanel .opt:active,.cpanel .opt:hover{background:#222833}
  .cpanel .typed{color:var(--mute);font-style:italic}
  .big{font-size:22px;font-weight:700;color:var(--good)}
  .kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .kv div{background:var(--bg);border-radius:8px;padding:6px 8px}
  .kv .k{font-size:11px;color:var(--mute)} .kv .v{font-weight:650}
  .warnbox{color:var(--warn);font-size:12px;margin-top:6px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chips button{border:1px solid var(--line);background:var(--panel2);color:var(--mute);border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chips button.on{color:#111;background:var(--acc);border-color:var(--acc)}
  .pill.lower{background:rgba(90,169,255,.18);color:var(--blue)} .pill.raise{background:rgba(62,207,142,.18);color:var(--good)} .pill.below{background:rgba(255,93,93,.2);color:var(--bad)}
  @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="dot" id="dot"></div><h1>Card Deal <span>Sniper</span></h1><button class="btn sm" id="pauseBtn" style="display:none"></button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>

<script>
const DEFAULT_SITE = "https://dancing-hummingbird-63c97a.netlify.app";
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem("cds_" + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem("cds_" + k, JSON.stringify(v)); } catch {} } };
const onNetlify = /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname);
let conn = { base: onNetlify ? location.origin : LS.get("base", DEFAULT_SITE), key: LS.get("key", "") };
let cfg = null, defaults = null, status = null, dirty = false, tab = LS.get("tab", "home"), sub = {};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => (n === null || n === undefined || n === "") ? "-" : "$" + Number(n).toFixed(2).replace(/\.00$/, "");
const until = (iso) => { const m = Math.max(1, Math.round((new Date(iso) - Date.now()) / 60000)); return m < 90 ? `in ${m} min` : `in ${Math.round(m / 60)} h`; };
const ago = (iso) => { if (!iso) return "never"; const s = (Date.now() - new Date(iso)) / 1000; if (s < 60) return "just now"; if (s < 3600) return Math.round(s / 60) + " min ago"; if (s < 86400) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago"; };
// Times shown in your configured zone (default Melbourne/Sydney time: AEST, AEDT in summer).
function tzName() { return (cfg && cfg.timezone) || "Australia/Sydney"; }
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso); if (isNaN(d)) return "";
  try { return new Intl.DateTimeFormat("en-AU", { timeZone: tzName(), day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true, timeZoneName: "short" }).format(d).replace(",", ""); }
  catch { return d.toLocaleString(); }
}
function fmtDate(iso) { if (!iso) return ""; try { return new Intl.DateTimeFormat("en-AU", { timeZone: tzName(), day: "numeric", month: "short", year: "numeric" }).format(new Date(iso)); } catch { return iso; } }
function localToday() { const p = Object.fromEntries(new Intl.DateTimeFormat("en-AU", { timeZone: tzName(), year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date()).map((x) => [x.type, x.value])); return `${p.year}-${p.month}-${p.day}`; }
const when = (iso) => iso ? `${fmtTime(iso)} · ${ago(iso)}` : "never";
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => (t.style.display = "none"), ms); }

async function api(path, opts = {}) {
  const r = await fetch(conn.base.replace(/\/$/, "") + "/api/" + path, {
    method: opts.method || "GET",
    headers: { "Content-Type": "application/json", "X-Admin-Key": conn.key },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: "no-store",
  });
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new Error(j.error || (j.errors || []).join("\n") || ("HTTP " + r.status)); e.status = r.status; e.errors = j.errors; throw e; }
  return j;
}

/* ---------------- connect screen ---------------- */
function renderConnect(err) {
  $("#nav").innerHTML = ""; $("#pauseBtn").style.display = "none";
  $("#app").innerHTML = `
  <div class="card"><h2>Connect</h2>
    ${err ? `<div class="err">${esc(err)}</div>` : ""}
    <p class="mute">Enter the admin key you set on Netlify (environment variable <b>ADMIN_KEY</b>). It's stored on this device only.</p>
    ${onNetlify ? "" : `<label>Site URL</label><input id="cBase" value="${esc(conn.base)}">`}
    <label>Admin key</label><input id="cKey" type="password" value="${esc(conn.key)}" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button class="btn pri" id="cGo">Connect</button></div>
  </div>`;
  $("#cGo").onclick = async () => {
    conn.key = $("#cKey").value.trim();
    if (!onNetlify) conn.base = $("#cBase").value.trim().replace(/\/$/, "");
    LS.set("key", conn.key); LS.set("base", conn.base);
    boot();
  };
}

/* ---------------- boot ---------------- */
async function boot() {
  if (!conn.key) return renderConnect();
  $("#app").innerHTML = `<div class="card mute">Loading…</div>`;
  try {
    const [c, s] = await Promise.all([api("config"), api("status")]);
    cfg = c.config; defaults = c.defaults; status = s; dirty = false;
  } catch (e) {
    return renderConnect(e.status === 401 ? "Wrong admin key." : `Couldn't reach the app: ${e.message}`);
  }
  renderNav(); render();
}

const TABS = [["home", "◉", "Home"], ["deals", "$", "Deals"], ["stock", "▣", "Stock"], ["ebay", "e", "eBay"], ["comps", "≈", "Comps"], ["retail", "▦", "Retail"], ["settings", "⚙", "Settings"]];
function renderNav() {
  $("#nav").innerHTML = TABS.map(([k, i, l]) => `<button data-t="${k}" class="${tab === k ? "on" : ""}"><b>${i}</b>${l}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach((b) => (b.onclick = () => { if ((dirty || stockDirty) && !confirm("You have unsaved changes. Leave this tab without saving?")) return; if (stockDirty) { stockDirty = false; stock = null; } if (dirty) { dirty = false; boot(); } tab = b.dataset.t; LS.set("tab", tab); renderNav(); render(); scrollTo(0, 0); }));
  const pb = $("#pauseBtn"); pb.style.display = "";
  pb.textContent = cfg.paused ? "▶ Resume" : "❚❚ Pause";
  pb.onclick = async () => { cfg.paused = !cfg.paused; await saveConfig(true); };
  const bad = status.configErrors.length || !status.env.ntfy || status.ebay.accessErrorDay || status.ebay.tokenFailSince;
  $("#dot").className = "dot " + (cfg.paused ? "warn" : bad ? "bad" : "ok");
}

function render() {
  try { ({ home: renderHome, deals: renderDeals, stock: renderStock, ebay: renderEbay, comps: renderComps, retail: renderRetail, settings: renderSettings })[tab](); }
  catch (e) { $("#app").innerHTML = `<div class="err">Display error: ${esc(e.message)}</div>`; console.error(e); }
}

function markDirty() { dirty = true; const sb = $("#savebar"); if (sb) sb.classList.add("show"); }
const saveBar = () => `<div class="savebar ${dirty ? "show" : ""}" id="savebar"><button class="btn pri" onclick="saveConfig()">Save changes</button></div>`;

async function saveConfig(quiet) {
  try {
    await api("config", { method: "PUT", body: { config: cfg } });
    dirty = false; toast(quiet ? (cfg.paused ? "Paused" : "Running") : "Saved ✓");
    status = await api("status"); renderNav(); render();
  } catch (e) {
    alert("Not saved:\n\n" + (e.errors ? e.errors.join("\n") : e.message));
  }
}

async function action(label, path, body, el) {
  const out = el || $("#out");
  if (out) out.innerHTML = `<div class="mute">${esc(label)}…</div>`;
  try {
    const r = await api(path, { method: "POST", body: body || {} });
    if (out) out.innerHTML = fmtResult(label, r);
    return r;
  } catch (e) {
    if (out) out.innerHTML = `<div class="err"><b>${esc(label)} failed</b><br>${esc(e.message)}</div>`;
  }
}

function fmtResult(label, r) {
  const errs = (r.errors || []).filter(Boolean);
  let h = errs.length ? `<div class="err"><b>${esc(label)}: problem</b><br>${esc(errs[0])}</div>` : `<div class="okmsg"><b>${esc(label)} ✓</b></div>`;
  if (r.total !== undefined) h += `<div class="item">Found <b>${r.total}</b> live listings. First: ${r.first ? `<a href="${esc(r.first.url)}" target="_blank">${esc(r.first.title)}</a> - ${money(r.first.price)}` : "none"}</div>`;
  if (r.preview && r.preview.length) h += `<h2 style="margin-top:10px">Alerts that would be sent (${r.preview.length})</h2>` + r.preview.map((p) => `<div class="item"><b>${esc(p.title)}</b><pre>${esc(p.body)}</pre></div>`).join("");
  if (r.results) h += r.results.map((x) => `<div class="item"><b>${esc(x.watch)}</b> <span class="mute">via ${esc(x.via || "-")}, ${x.found ?? "blocked"} products</span>${x.notes && x.notes.length ? `<pre>${esc(x.notes.join("\n"))}</pre>` : ""}${(x.matches || []).map((m) => `<div class="mute">${esc(m.name)} - ${money(m.price)} ${m.inStock === true ? "in stock" : m.inStock === false ? "OUT" : ""}</div>`).join("")}</div>`).join("");
  if (r.log && r.log.length) h += `<div class="log"><pre>${esc(r.log.map((l) => l.replace(/^\S+ /, "")).join("\n"))}</pre></div>`;
  return h;
}

/* ---------------- Home ---------------- */
function renderHome() {
  const s = status, e = s.ebay, pct = Math.min(100, (e.callsTodayUTC / e.cap) * 100);
  const blocks = Object.entries(s.retail.blocks || {}).filter(([, b]) => b.until && new Date(b.until) > new Date());
  const warn = [];
  if (!s.env.ntfy) warn.push("NTFY_TOPIC isn't set on Netlify - no alerts can reach your phone.");
  if (!s.env.ebayKeys) warn.push("eBay keys not set yet (EBAY_CLIENT_ID / EBAY_CLIENT_SECRET). The eBay watcher is idle until you add them.");
  if (e.accessErrorDay) warn.push("eBay refused production Browse access - you probably need the Application Growth Check (see Settings > Help).");
  if (e.tokenFailSince) warn.push(`eBay login failing since ${fmtTime(e.tokenFailSince)} - check the keys are PRODUCTION keys.`);
  s.configErrors.forEach((x) => warn.push("Config: " + x));
  $("#app").innerHTML = `
  ${cfg.paused ? `<div class="err">Paused - nothing is being checked. Tap Resume at the top.</div>` : ""}
  ${warn.map((w) => `<div class="err">${esc(w)}</div>`).join("")}
  <div class="card"><h2>Today</h2><div class="grid">
    <div class="stat"><div class="k">eBay calls (UTC day)</div><div class="v">${e.callsTodayUTC}<span class="mute"> / ${e.cap}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="stat"><div class="k">Retail checks</div><div class="v">${s.retail.checksToday}</div></div>
    <div class="stat"><div class="k">Searches</div><div class="v">${cfg.ebay.searches.length}</div></div>
    <div class="stat"><div class="k">Retail watches</div><div class="v">${cfg.retailers.watches.length}</div></div>
  </div>
  <p class="mute" style="margin:10px 0 0">Last heartbeat: ${s.meta.heartbeatDate || "not yet"} · hourly job ${when(s.meta.lastHourly)} · ${e.seenCount} listings remembered</p></div>
  ${blocks.length ? `<div class="card"><h2>Backing off</h2>${blocks.map(([k, b]) => `<div class="item"><div class="top"><b>${esc(k)}</b><button class="btn sm" onclick="unblock('${esc(k)}')">Clear</button></div><div class="mute">${esc(b.lastStatus)} · retry ${until(b.until)} (until ${fmtTime(b.until)})</div></div>`).join("")}</div>` : ""}
  <div class="card"><h2>Checks</h2>
    <div class="row">
      <button class="btn" onclick="action('Test notification','test-ntfy')">Test phone alert</button>
      <button class="btn" onclick="testEbay()">Test eBay</button>
      <button class="btn" onclick="action('eBay dry run','run/ebay?dry=1')">eBay dry run</button>
      <button class="btn" onclick="action('Retail dry run','run/retail?dry=1')">Retail dry run</button>
      <button class="btn" onclick="action('Heartbeat','run/heartbeat')">Send heartbeat</button>
    </div>
    <p class="mute">Dry runs show what would alert without sending or remembering anything.</p>
    <div id="out"></div>
  </div>`;
}
async function testEbay() { const q = prompt("Search to test (live eBay AU, uses 1 call):", cfg.ebay.searches[0]?.q || "pokemon booster box"); if (q) action("eBay test", "test-ebay", { q }); }
async function unblock(r) { await action("Clear block", "unblock", { retailer: r }); status = await api("status"); render(); }

/* ---------------- Deals ---------------- */
async function renderDeals() {
  sub.deals ||= "alerts";
  $("#app").innerHTML = `<div class="seg"><button data-s="alerts" class="${sub.deals === "alerts" ? "on" : ""}">Alerts sent</button><button data-s="misses" class="${sub.deals === "misses" ? "on" : ""}">No-comp misses</button></div><div id="list" class="mute">Loading…</div>`;
  document.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => { sub.deals = b.dataset.s; renderDeals(); }));
  try {
    if (sub.deals === "alerts") {
      const { alerts } = await api("alerts");
      $("#list").innerHTML = alerts.length ? alerts.map((a) => {
        const v = /-> BUY/.test(a.body) ? ["buy", "BUY"] : /-> WAIT/.test(a.body) ? ["wait", "WAIT"] : a.kind === "restock" ? ["restock", "RESTOCK"] : ["drop", "PRICE"];
        return `<div class="item"><div class="top"><span class="pill ${v[0]}">${v[1]}</span><span class="mute">${when(a.sentAt)}${a.queued ? " · in summary" : ""}${a.error ? " · send failed" : ""}</span></div><b>${esc(a.title.replace(/^(DEAL|RESTOCK|PRICE DROP): /, ""))}</b><pre>${esc(a.body.replace(/\n\nhttps?:\S+$/, ""))}</pre>${a.url ? `<div style="margin-top:6px"><a href="${esc(a.url)}" target="_blank" rel="noopener">Open listing →</a></div>` : ""}</div>`;
      }).join("") : `<div class="card mute">No alerts yet. They'll show here as well as on your phone.</div>`;
    } else {
      const { misses } = await api("misses");
      $("#list").innerHTML = `<p class="mute">Listings with no comp to judge them by. Tap "Add comp" to teach the app.</p>` + (misses.length ? misses.map((m, i) => `<div class="item"><div class="top"><b>${esc(m.title)}</b></div><div class="mute">Landed ${money(m.landed)} · ${when(m.seenAt)} · search "${esc(m.q || "")}"</div><div class="row" style="margin-top:8px"><a href="${esc(m.url)}" target="_blank" rel="noopener">Open</a><button class="btn sm" data-i="${i}">Add comp</button></div></div>`).join("") : `<div class="card mute">No misses.</div>`);
      $("#list").querySelectorAll("button[data-i]").forEach((b) => (b.onclick = () => {
        const m = misses[b.dataset.i];
        cfg.comps.manual.push({ name: m.title.slice(0, 60), match_keywords: [m.title.toLowerCase().slice(0, 40)], comp_aud: null, comp_source: "", comp_date: localToday() });
        dirty = true; tab = "comps"; LS.set("tab", tab); renderNav(); render(); toast("Comp added - trim the keyword and set a price, then Save");
      }));
    }
  } catch (e) { $("#list").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ---------------- catalog + dropdowns ---------------- */
const GRADES = ["Raw", "PSA 10", "PSA 9", "PSA 8", "CGC 10", "CGC 9.5", "CGC 9", "BGS 10", "BGS 9.5", "ACE 10", "TAG 10"];
function catalog() { return (cfg && cfg.catalog) || (defaults && defaults.catalog) || { set_groups: [], products: [] }; }
function optionGroups(src) {
  const c = catalog();
  if (src === "sets") return c.set_groups.map((g) => ({ label: g.era, items: g.sets }));
  if (src === "products") {
    const by = {};
    c.products.forEach((p) => { (by[p.group || "Products"] ||= []).push(p.name); });
    return Object.entries(by).map(([label, items]) => ({ label, items }));
  }
  if (src === "grades") return [{ label: "Grade", items: GRADES }];
  if (src === "sealed_or_card") {
    return [{ label: "Sealed products (or type a card name)", items: c.products.map((p) => p.name) }];
  }
  return [];
}
const norm = (x) => String(x || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();

// Work out set + product from an existing name, so old entries show in the dropdowns.
function detectParts(name) {
  const n = ` ${norm(name)} `;
  let set = "", product = "";
  for (const g of catalog().set_groups) for (const st of g.sets) {
    const v = [norm(st), norm(st.replace(/&/g, "and"))];
    if (v.some((x) => x && n.includes(` ${x} `)) && st.length > set.length) set = st;
  }
  let best = 0;
  for (const p of catalog().products) for (const a of p.aliases || [p.name]) {
    const x = norm(a);
    if (x && n.includes(` ${x} `) && x.length > best) { best = x.length; product = p.name; }
  }
  return { set, product };
}
function keywordsFor(set, product) {
  const sets = [...new Set([set, set.replace(/&/g, "and")].filter(Boolean))];
  const p = catalog().products.find((x) => x.name === product);
  const aliases = product ? (p ? p.aliases : [product]) : [""];
  const out = [];
  (sets.length ? sets : [""]).forEach((sv) => aliases.forEach((a) => { const k = `${sv} ${a}`.trim().toLowerCase(); if (k) out.push(k); }));
  return [...new Set(out)];
}
const baseName = (o) => [o.set, o.product].filter(Boolean).join(" ");

// What picking a set/product fills in, per screen.
const AUTOFILL = {
  comps(o) { if (!o.set && !o.product) return; o.name = baseName(o); o.match_keywords = keywordsFor(o.set || "", o.product || ""); },
  ebay(o) { if (!o.set && !o.product) return; o.q = `pokemon ${baseName(o)}`; o.comp_query = baseName(o); },
  retail(o) { if (!o.set && !o.product) return; o.query = `pokemon ${baseName(o)}`; o.match = baseName(o); },
  stock() {},
};

function comboHtml(attr, value, src, ph) {
  return `<div class="combo"><input type="text" ${attr} data-src="${src}" value="${esc(value ?? "")}" placeholder="${esc(ph || "Tap ▾ or type")}" autocomplete="off"><button type="button" class="cbtn" tabindex="-1">▾</button><div class="cpanel"></div></div>`;
}
// Wire every .combo inside root. onPick(input, value) is called when an option is chosen.
function bindCombos(root, onPick) {
  root.querySelectorAll(".combo").forEach((box) => {
    const inp = box.querySelector("input"), panel = box.querySelector(".cpanel"), btn = box.querySelector(".cbtn");
    const draw = (filter) => {
      const f = norm(filter);
      let html = "", n = 0;
      if (f) html += `<div class="opt typed" data-v="${esc(filter)}">Use "${esc(filter)}"</div>`;
      for (const g of optionGroups(inp.dataset.src)) {
        const items = g.items.filter((x) => !f || norm(x).includes(f));
        if (!items.length) continue;
        html += `<div class="grp">${esc(g.label)}</div>` + items.slice(0, 120).map((x) => `<div class="opt" data-v="${esc(x)}">${esc(x)}</div>`).join("");
        n += items.length;
      }
      panel.innerHTML = html || `<div class="opt typed">No match - keep typing to use your own text</div>`;
      panel.classList.add("open");
    };
    const close = () => panel.classList.remove("open");
    inp.addEventListener("focus", () => draw(""));
    inp.addEventListener("input", () => draw(inp.value));
    inp.addEventListener("blur", () => setTimeout(close, 180));
    btn.addEventListener("pointerdown", (e) => { e.preventDefault(); if (panel.classList.contains("open")) close(); else { inp.focus(); draw(""); } });
    panel.addEventListener("pointerdown", (e) => {
      const opt = e.target.closest(".opt[data-v]");
      if (!opt) return;
      e.preventDefault();
      inp.value = opt.dataset.v;
      close();
      onPick(inp, opt.dataset.v);
    });
  });
}

/* ---------------- generic list editor ---------------- */
// fields: [key, label, type, opts]  type: str|num|list|date|dt|bool|select|combo|_test
function fieldHtml(o, i, [k, label, type, opt]) {
  const full = opt?.full ? ' style="grid-column:1/-1"' : "";
  const val = (() => {
    const v = o[k];
    if (v === undefined || v === null) return "";
    if (type === "list") return v.join(", ");
    if (type === "dt") { const d = new Date(v); return isNaN(d) ? "" : new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); }
    return v;
  })();
  if (type === "bool") return `<label${full}><input type="checkbox" data-f="${i}|${k}|bool" ${o[k] ? "checked" : ""}>${esc(label)}</label>`;
  if (type === "select") return `<div${full}><label>${esc(label)}</label><select data-f="${i}|${k}|str">${opt.options.map(([v, l]) => `<option value="${esc(v)}" ${o[k] === v ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></div>`;
  if (type === "combo") return `<div${full}><label>${esc(label)}</label>${comboHtml(`data-f="${i}|${k}|str"`, val, opt.src, opt.ph)}</div>`;
  const it = type === "num" ? 'type="number" step="any" inputmode="decimal"' : type === "date" ? 'type="date"' : type === "dt" ? 'type="datetime-local"' : 'type="text"';
  return `<div${full}><label>${esc(label)}</label><input ${it} data-f="${i}|${k}|${type}" value="${esc(val)}" placeholder="${esc(opt?.ph || "")}"></div>`;
}

function readField(inp) {
  const [, , type] = inp.dataset.f.split("|");
  let v = inp.type === "checkbox" ? inp.checked : inp.value;
  if (type === "num") v = v === "" ? undefined : Number(v);
  if (type === "list") v = v.split(",").map((x) => x.trim()).filter(Boolean);
  if (type === "dt") v = v ? new Date(v).toISOString() : undefined;
  return v;
}

// Bind inputs in root to arr items. kind = autofill profile. after() runs after any change.
function bindFields(root, arr, kind, after) {
  root.querySelectorAll("[data-f]").forEach((inp) => {
    const [i, k, type] = inp.dataset.f.split("|");
    const ev = inp.type === "checkbox" || inp.tagName === "SELECT" ? "change" : "input";
    inp.addEventListener(ev, () => {
      const o = arr[+i], v = readField(inp);
      if (v === undefined || v === "" || (Array.isArray(v) && !v.length && type === "list" && k !== "match_keywords")) delete o[k]; else o[k] = v;
      after();
    });
    // typing your own set/product then leaving the box also auto-fills
    if (inp.dataset.src && (k === "set" || k === "product")) inp.addEventListener("change", () => { AUTOFILL[kind](arr[+i]); render(); });
  });
  bindCombos(root, (inp) => {
    const [i, k] = inp.dataset.f.split("|");
    arr[+i][k] = inp.value;
    if (k === "set" || k === "product") AUTOFILL[kind](arr[+i]);
    after(); render();
  });
}

function listEditor(arr, fields, title, newItem, kind = "comps") {
  const id = "le" + Math.random().toString(36).slice(2, 7);
  // show detected set/product on older entries
  if (fields.some((f) => f[0] === "set")) arr.forEach((o) => {
    if (o.set === undefined && o.product === undefined) { const d = detectParts(o.name || o.q || o.query || ""); if (d.set) o.set = d.set; if (d.product) o.product = d.product; }
  });
  setTimeout(() => {
    const root = document.getElementById(id);
    if (!root) return;
    bindFields(root, arr, kind, markDirty);
    root.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { if (confirm("Remove this?")) { arr.splice(+b.dataset.del, 1); dirty = true; render(); } }));
    root.querySelectorAll("[data-test]").forEach((b) => (b.onclick = () => action("Test watch", "run/retail?dry=1", { only: +b.dataset.test }, document.getElementById("t" + b.dataset.test))));
    root.querySelector("[data-add]").onclick = () => { arr.push(newItem()); dirty = true; render(); };
  });
  return `<div id="${id}">${arr.map((o, i) => `<div class="item">
    <div class="top"><b>${esc(title(o, i))}</b><div class="row">${fields.some((f) => f[0] === "_test") ? `<button class="btn sm" data-test="${i}">Test</button>` : ""}<button class="btn sm danger" data-del="${i}">✕</button></div></div>
    <div class="two">${fields.filter((f) => f[0] !== "_test").map((f) => fieldHtml(o, i, f)).join("")}</div>
    ${fields.some((f) => f[0] === "_test") ? `<div id="t${i}"></div>` : ""}
  </div>`).join("")}
  <button class="btn" data-add>+ Add</button></div>`;
}

function settingInputs(obj, rows) {
  const id = "si" + Math.random().toString(36).slice(2, 7);
  setTimeout(() => { const r = document.getElementById(id); if (r) r.querySelectorAll("[data-k]").forEach((inp) => inp.addEventListener(inp.type === "checkbox" || inp.tagName === "SELECT" ? "change" : "input", () => {
    const [k, type] = inp.dataset.k.split("|");
    let v = inp.type === "checkbox" ? inp.checked : inp.value;

    if (type === "lines") v = v.split(/[\n,]/).map((x) => x.trim()).filter(Boolean);
    obj[k] = v; markDirty();
  })); });
  return `<div id="${id}" class="two">${rows.map(([k, label, type, help, opts]) => {
    if (type === "bool") return `<label style="grid-column:1/-1"><input type="checkbox" data-k="${k}|bool" ${obj[k] ? "checked" : ""}>${esc(label)}</label>`;

  ["shipping_in", "Shipping paid $ (total)", "num", { ph: "0" }],
  ["bought_on", "Bought on", "date"],
  ["bought_from", "Bought from", "str", { ph: "eBay seller, store, market" }],
  ["status", "Status", "select", { options: [["holding", "Holding"], ["listed", "Listed"], ["sold", "Sold"]] }],
  ["list_price", "Listed at $", "num"],
  ["sold_price", "Sold for $ (item price)", "num"],
  ["sold_on", "Sold on", "date"],
  ["ebay_item_id", "eBay item number", "str", { ph: "links it to your listing" }],
  ["comp_query", "Price it as (optional)", "str", { full: true, ph: "defaults to set + name + number + grade" }],
  ["manual_value", "My own value $ (if no comp)", "num"],
  ["notes", "Notes", "str", { full: true }],
];
async function loadStock() { const r = await api("stock"); stock = r.items.map(({ pricing, ...it }) => ({ ...it, _p: pricing })); stockTotals = r.totals; stockDirty = false; }
async function saveStock() {
  try { await api("stock", { method: "PUT", body: { items: stock.map(({ _p, ...it }) => it) } }); await loadStock(); toast("Stock saved ✓"); render(); }
  catch (e) { alert("Not saved: " + e.message); }
}
function stockTitle(it) { return [it.set, it.name, it.number, it.grade && it.grade !== "Raw" ? it.grade : ""].filter(Boolean).join(" ") || "New item"; }

async function renderStock() {
  sub.stock ||= "stock";
  const seg = `<div class="seg"><button data-s="stock" class="${sub.stock === "stock" ? "on" : ""}">My stock</button><button data-s="store" class="${sub.stock === "store" ? "on" : ""}">My eBay listings</button></div>`;
  if (sub.stock === "store") return renderStore(seg);
  if (!stock) { $("#app").innerHTML = seg + `<div class="card mute">Loading…</div>`; bindSeg(); try { await loadStock(); } catch (e) { $("#app").innerHTML = seg + `<div class="err">${esc(e.message)}</div>`; bindSeg(); return; } }
  const t = stockTotals || {};
  const shown = stock.map((it, i) => [it, i]).filter(([it]) => stockFilter === "all" ? true : stockFilter === "sold" ? it.status === "sold" : it.status !== "sold");
  const fee = Math.round(cfg.ebay.fee_rate * 100);
  $("#app").innerHTML = seg + `
  <div class="card"><h2>Overview</h2><div class="grid">
    <div class="stat"><div class="k">Invested (held)</div><div class="v">${money(t.invested)}</div></div>
    <div class="stat"><div class="k">Market value (held)</div><div class="v">${money(t.holdingValue)}</div></div>
    <div class="stat"><div class="k">Realised profit</div><div class="v" style="color:${(t.realised || 0) >= 0 ? "var(--good)" : "var(--bad)"}">${money(t.realised)}</div></div>
    <div class="stat"><div class="k">Held / sold</div><div class="v">${t.holdingCount || 0} / ${t.soldCount || 0}</div></div>
  </div>
  <p class="mute" style="margin:8px 0 0">Recommended prices use AU sold comps, ${fee}% eBay fees and ${money(cfg.ebay.outbound_postage)} postage, and never go below your break-even.</p>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="stAdd">+ Add item</button><button class="btn" id="stRefresh">Refresh market prices</button></div><div id="stOut"></div></div>
  <div class="chips">${[["active", "Holding & listed"], ["sold", "Sold"], ["all", "All"]].map(([k, l]) => `<button data-c="${k}" class="${stockFilter === k ? "on" : ""}">${l}</button>`).join("")}</div>
  <div id="stList">${shown.length ? shown.map(([it, i]) => stockCard(it, i)).join("") : `<div class="card mute">Nothing here yet. Tap “+ Add item” after you buy something.</div>`}</div>
  <div class="savebar ${stockDirty ? "show" : ""}" id="stSave"><button class="btn pri">Save stock</button></div>`;
  bindSeg();
  document.querySelectorAll(".chips button").forEach((b) => (b.onclick = () => { stockFilter = b.dataset.c; LS.set("stockFilter", stockFilter); render(); }));
  $("#stAdd").onclick = () => { stock.unshift({ id: Math.random().toString(36).slice(2, 10), qty: 1, grade: "Raw", status: "holding", bought_on: localToday(), shipping_in: 0 }); openStock = stock[0].id; stockDirty = true; stockFilter = "active"; render(); };
  $("#stRefresh").onclick = async () => {
    if (stockDirty) await saveStock();
    $("#stOut").innerHTML = `<div class="mute">Looking up AU sold prices…</div>`;
    try { await api("stock/refresh", { method: "POST" }); await loadStock(); render(); toast("Market prices updated"); }
    catch (e) { $("#stOut").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  $("#stSave").querySelector("button").onclick = saveStock;
  const list = $("#stList");
  list.querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => { openStock = openStock === b.dataset.edit ? null : b.dataset.edit; render(); }));
  list.querySelectorAll("[data-sdel]").forEach((b) => (b.onclick = () => { if (confirm("Delete this item?")) { stock.splice(+b.dataset.sdel, 1); stockDirty = true; render(); } }));
  list.querySelectorAll("[data-sold]").forEach((b) => (b.onclick = () => {
    const it = stock[+b.dataset.sold];
    const v = prompt("Sold for $ (item price, not postage):", it.list_price ?? it._p?.recommended ?? "");
    if (v === null || v === "" || isNaN(Number(v))) return;
    it.status = "sold"; it.sold_price = Number(v); it.sold_on = localToday(); stockDirty = true; saveStock();
  }));
  bindFields(list, stock, "stock", () => { stockDirty = true; $("#stSave").classList.add("show"); });
}

function stockCard(it, i) {
  const p = it._p || {};
  const pill = it.status === "sold" ? ["buy", "SOLD"] : it.status === "listed" ? ["drop", "LISTED"] : ["wait", "HOLDING"];
  const mk = it.market;
  const mkLine = mk ? `${money(mk.comp_aud)} · ${esc(mk.label)}${mk.sample ? `, ${mk.sample} AU sales` : ""} · ${fmtDate(mk.as_of)}` : it.manual_value ? `${money(it.manual_value)} (your value)` : "no comp yet - tap Refresh";
  const open = openStock === it.id;
  return `<div class="item">
    <div class="top"><b>${esc(stockTitle(it))}${(it.qty || 1) > 1 ? ` ×${it.qty}` : ""}</b><span class="pill ${pill[0]}">${pill[1]}</span></div>
    ${it.status === "sold" ? `
      <div class="kv"><div><div class="k">Cost</div><div class="v">${money(p.cost)}</div></div><div><div class="k">Sold</div><div class="v">${money(it.sold_price)}</div></div><div><div class="k">Profit</div><div class="v" style="color:${(p.realised || 0) >= 0 ? "var(--good)" : "var(--bad)"}">${money(p.realised)}${p.roi !== null && p.roi !== undefined ? ` (${p.roi}%)` : ""}</div></div></div>
      <div class="mute" style="margin-top:6px">Sold ${esc(fmtDate(it.sold_on))} · after ${Math.round((p.fee || 0) * 100)}% fees + ${money(p.post)} post</div>` : `
      <div class="mute" style="margin-top:4px">Market: ${mkLine}</div>
      <div style="margin-top:6px">List at <span class="big">${money(p.recommended)}</span> <span class="mute">(${esc(p.basis || "")})</span></div>
      <div class="kv"><div><div class="k">Cost</div><div class="v">${money(p.cost)}</div></div><div><div class="k">Break-even</div><div class="v">${money(p.breakeven)}</div></div><div><div class="k">Profit at rec.</div><div class="v" style="color:${(p.profitAtRecommended || 0) >= 0 ? "var(--good)" : "var(--bad)"}">${money(p.profitAtRecommended)}</div></div></div>
      ${it.status === "listed" && it.list_price ? `<div class="mute" style="margin-top:6px">Listed at ${money(it.list_price)}${it.ebay_url ? ` · <a href="${esc(it.ebay_url)}" target="_blank" rel="noopener">open</a>` : ""}</div>` : ""}
      ${p.warning ? `<div class="warnbox">${esc(p.warning)}</div>` : ""}`}
    <div class="row" style="margin-top:8px"><button class="btn sm" data-edit="${esc(it.id)}">${open ? "Close" : "Edit"}</button>${it.status !== "sold" ? `<button class="btn sm" data-sold="${i}">Mark sold</button>` : ""}<button class="btn sm danger" data-sdel="${i}">Delete</button></div>
    ${open ? `<div class="two" style="margin-top:6px">${STOCK_FIELDS.map((f) => fieldHtml(it, i, f)).join("")}</div>` : ""}
  </div>`;
}

async function renderStore(seg) {
  const ms = cfg.my_store;
  $("#app").innerHTML = seg + `<div class="card"><h2>My eBay listings</h2>
    ${ms.seller_username ? `<p class="mute">Seller <b>${esc(ms.seller_username)}</b> · checked every ${ms.interval_hours}h${ms.enabled ? "" : " (watcher OFF - turn on in Settings)"} · alerts when a price is more than ${ms.adjust_threshold_pct}% off market, and never suggests below your break-even.</p>` : `<div class="err">Add your eBay seller username in Settings → My eBay store.</div>`}
    <div class="row"><button class="btn pri" id="msRun">Check now</button><button class="btn" id="msDry">Preview alerts</button></div><div id="msOut"></div></div>
    <div id="msList" class="mute">Loading…</div>`;
  bindSeg();
  const show = (r) => {
    const rows = r.listings || [];
    const pill = { LOWER: ["lower", "LOWER"], RAISE: ["raise", "RAISE"], BELOW_COST: ["below", "BELOW COST"], OK: ["buy", "OK"], NO_COMP: ["wait", "NO COMP"] };
    $("#msList").innerHTML = (r.lastRun ? `<p class="mute">Last checked ${when(r.lastRun)}</p>` : "") + (rows.length ? rows.map((x) => `<div class="item">
      <div class="top"><b>${esc(x.title)}</b><span class="pill ${pill[x.action]?.[0] || ""}">${pill[x.action]?.[1] || x.action}</span></div>
      <div class="kv"><div><div class="k">Your price</div><div class="v">${money(x.price)}</div></div><div><div class="k">Market</div><div class="v">${money(x.market)}</div></div><div><div class="k">Break-even</div><div class="v">${x.breakeven ? money(x.breakeven) : "link stock"}</div></div></div>
      ${x.suggested ? `<div style="margin-top:6px">Suggested: <span class="big">${money(x.suggested)}</span> <span class="mute">${esc(x.reason)}</span></div>` : `<div class="mute" style="margin-top:6px">${esc(x.reason || "")}</div>`}
      ${x.compLabel ? `<div class="mute">${esc(x.compLabel)}</div>` : ""}
      <a href="${esc(x.url)}" target="_blank" rel="noopener">Open listing →</a>
    </div>`).join("") : `<div class="card mute">No listings checked yet.</div>`);
  };
  try { show(await api("store")); } catch (e) { $("#msList").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  $("#msRun").onclick = async () => { const r = await action("Store check", "run/store", {}, $("#msOut")); if (r) { show({ ...r, lastRun: new Date().toISOString() }); stock = null; } };
  $("#msDry").onclick = () => action("Store preview", "run/store?dry=1", {}, $("#msOut"));
}
function bindSeg() { document.querySelectorAll(".seg button").forEach((b) => (b.onclick = () => { sub.stock = b.dataset.s; render(); })); }

/* ---------------- Settings ---------------- */
function renderSettings() {
  $("#app").innerHTML = `
  <div class="card"><h2>General</h2>
    ${settingInputs(cfg, [["timezone", "Time zone for all times shown and sent", "select", "Melbourne/Sydney time switches to AEDT in summer, like your clock. Pick AEST all year if you want fixed UTC+10.", [["Australia/Sydney", "Melbourne / Sydney time (AEST, AEDT in summer)"], ["Australia/Brisbane", "AEST all year (UTC+10)"], ["Australia/Adelaide", "Adelaide time (ACST/ACDT)"], ["Australia/Perth", "Perth time (AWST)"]]]])}
    ${settingInputs(cfg.alerts, [["heartbeat_hour", "Heartbeat hour (local, 0-23)", "num"], ["max_per_hour", "Max alerts / hour", "num", "extras roll into one summary"]])}
  </div>
  <div class="card"><h2>My eBay store</h2>
    <p class="mute">Reads your live listings by seller username (public data, uses your eBay keys, no login needed) and alerts when a price should move with the AU market. It never changes prices on eBay for you.</p>
    ${settingInputs(cfg.my_store, [
      ["enabled", "Watch my listings", "bool"], ["seller_username", "eBay seller username", "str"],
      ["search_q", "Only listings matching", "str", "default: pokemon"], ["interval_hours", "Check every (hours)", "num"],
      ["adjust_threshold_pct", "Alert when off market by (%)", "num"], ["cooldown_hours", "Repeat alert after (hours)", "num"],
    ])}
  </div>
  <div class="card"><h2>Resale pricing</h2>
    ${settingInputs(cfg.stock, [["target_profit_pct", "Target profit (fraction of cost)", "num", "0.2 = 20%, used when there's no comp"], ["target_profit_min", "Minimum target profit $", "num"]])}
    <p class="mute">Fee rate and outbound postage come from the eBay tab (${Math.round(cfg.ebay.fee_rate * 100)}% and ${money(cfg.ebay.outbound_postage)}).</p>
  </div>
  <div class="card"><h2>Advanced (full config)</h2>
    <p class="mute">Edit everything here, including retailer endpoints (anything marked VERIFY), the set list (catalog) and TCG Prices AU field paths. Saving checks it first.</p>
    <textarea id="adv" style="min-height:300px">${esc(JSON.stringify(cfg, null, 2))}</textarea>
    <div class="row" style="margin-top:8px">
      <button class="btn pri" id="advSave">Save full config</button>
      <button class="btn" id="advReset">Load defaults</button>
    </div>
  </div>
  <div class="card"><h2>Maintenance</h2><div class="row">
    <button class="btn" onclick="if(confirm('Forget every seen listing? Current listings may alert again.'))action('Reset seen','reset-seen')">Reset seen listings</button>
    <button class="btn" onclick="localStorage.removeItem('cds_key');conn.key='';renderConnect()">Sign out on this device</button>
  </div><div id="out"></div></div>
  <div class="card"><h2>Help</h2><div class="mute">
    <p><b>Phone alerts:</b> install ntfy, tap +, subscribe to your topic name (the NTFY_TOPIC value on Netlify).</p>
    <p><b>eBay keys:</b> developer.ebay.com → Application Keys → <b>Production</b> App ID + Cert ID → add as EBAY_CLIENT_ID / EBAY_CLIENT_SECRET in Netlify → Environment variables → redeploy. Then Home → Test eBay. If it says access denied, apply for the Application Growth Check in the developer portal.</p>
    <p><b>AU sold prices:</b> add a TCG Prices AU API key as TCGPRICES_API_KEY on Netlify. Also apply for eBay Marketplace Insights in the developer portal.</p>
  </div></div>`;
  $("#advSave").onclick = () => { try { cfg = JSON.parse($("#adv").value); saveConfig(); } catch (e) { alert("That isn't valid JSON: " + e.message); } };
  $("#advReset").onclick = () => { if (confirm("Replace the editor contents with defaults? (Not saved until you tap Save.)")) $("#adv").value = JSON.stringify(defaults, null, 2); };
}

window.addEventListener("beforeunload", (e) => { if (dirty || stockDirty) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", async () => { if (!document.hidden && cfg && !dirty && tab === "home") { try { status = await api("status"); renderNav(); render(); } catch {} } });
boot();
</script>
</body>
</html>
